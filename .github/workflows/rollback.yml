name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'S3 artifact timestamp (e.g., 20260819-123456) or "latest"'
        required: true
        default: 'latest'

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Rollback to specified artifact
        run: |
          if [ "${{ github.event.inputs.artifact }}" = "latest" ]; then
            S3_PATH="s3://kairacure-artifacts-prod/backend/latest.zip"
          else
            S3_PATH="s3://kairacure-artifacts-prod/backend/${{ github.event.inputs.artifact }}.zip"
          fi
          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-048117c391049faa7 \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters "commands=[\"set -e\", \"cd /opt/kairacure\", \"aws s3 cp $S3_PATH /tmp/backend.zip --region ap-south-1\", \"pm2 stop kairacure-api 2>/dev/null || true\", \"rm -rf kairacure-backend-api\", \"mkdir -p kairacure-backend-api\", \"unzip -o /tmp/backend.zip -d kairacure-backend-api/\", \"rm -f /tmp/backend.zip\", \"cd kairacure-backend-api\", \"aws s3 cp s3://kairacure-artifacts-prod/config/prod.env .env --region ap-south-1\", \"npm ci --production 2>&1 | tail -5\", \"pm2 start index.js --name kairacure-api --max-memory-restart 300M\", \"pm2 save\", \"sleep 5\", \"echo ROLLBACK_SUCCESS\"]" \
            --query 'Command.CommandId' --output text)
          echo "Rollback command: $COMMAND_ID"
          sleep 120
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-048117c391049faa7 \
            --query 'Status' --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "Rollback successful"
          else
            echo "Rollback failed"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-048117c391049faa7 --query 'StandardOutputContent' --output text | tail -20
            exit 1
          fi
