name: PR Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'kairacure-backend-api/**'
      - 'kairacure-web/**'
      - 'kairacure-admin/**'

permissions:
  contents: read

jobs:
  check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairacure-backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kairacure-backend-api/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high || true

  check-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairacure-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kairacure-web/package-lock.json
      - run: npm ci
      - run: npm run build

  check-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kairacure-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kairacure-admin/package-lock.json
      - run: npm ci
      - run: npm run build
