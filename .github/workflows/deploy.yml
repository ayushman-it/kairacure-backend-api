name: Deploy Backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE: i-048117c391049faa7

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & verify
        run: |
          npm ci --production
          node --check index.js
          echo "Syntax OK"

      - name: Build artifact
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          COMMIT=$(git rev-parse --short HEAD)
          zip -r /tmp/backend.zip . \
            -x ".git/*" ".github/*" "infra/*" "backups/*" ".env*" "node_modules/*" "*.md"
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "COMMIT=${COMMIT}" >> $GITHUB_ENV

      - name: Upload to S3
        run: |
          aws s3 cp /tmp/backend.zip s3://kairacure-artifacts-prod/backend/${{ env.TIMESTAMP }}.zip --region ${{ env.AWS_REGION }}
          aws s3 cp /tmp/backend.zip s3://kairacure-artifacts-prod/backend/latest.zip --region ${{ env.AWS_REGION }}
          echo "Artifact: s3://kairacure-artifacts-prod/backend/latest.zip"

      - name: Deploy to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids ${{ env.EC2_INSTANCE }} \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "set -e",
              "cd /opt/kairacure",
              "aws s3 cp s3://kairacure-artifacts-prod/backend/latest.zip /tmp/backend.zip --region ap-south-1",
              "pm2 stop kairacure-api 2>/dev/null || true",
              "rm -rf kairacure-backend-api",
              "mkdir -p kairacure-backend-api",
              "unzip -o /tmp/backend.zip -d kairacure-backend-api/",
              "rm -f /tmp/backend.zip",
              "cd kairacure-backend-api",
              "aws s3 cp s3://kairacure-artifacts-prod/config/prod.env .env --region ap-south-1",
              "npm ci --production 2>&1 | tail -5",
              "pm2 start index.js --name kairacure-api --max-memory-restart 300M",
              "pm2 save",
              "sleep 10",
              "for i in 1 2 3 4 5 6; do HEALTH=$(curl -s -o /dev/null -w \"%{http_code}\" http://localhost:5000/api/health 2>/dev/null || echo 000); if [ \"$HEALTH\" = \"200\" ]; then echo DEPLOY_SUCCESS; exit 0; fi; echo \"Health check $i: $HEALTH\"; sleep 10; done; echo HEALTH_CHECK_FAILED; exit 1"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command: $COMMAND_ID"

      - name: Wait for deployment
        run: |
          COMMAND_ID=${{ steps.deploy.outputs.command_id }}
          echo "Waiting for deployment (up to 5 minutes)..."
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region ${{ env.AWS_REGION }} \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ env.EC2_INSTANCE }} \
              --query 'Status' --output text 2>/dev/null)
            echo "  [$i] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Backend deployed successfully (commit ${{ env.COMMIT }})"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deploy failed:"
              aws ssm get-command-invocation \
                --region ${{ env.AWS_REGION }} \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ env.EC2_INSTANCE }} \
                --query 'StandardOutputContent' --output text 2>/dev/null | tail -20
              aws ssm get-command-invocation \
                --region ${{ env.AWS_REGION }} \
                --command-id "$COMMAND_ID" \
                --instance-id ${{ env.EC2_INSTANCE }} \
                --query 'StandardErrorContent' --output text 2>/dev/null | tail -20
              exit 1
            fi
          done
          echo "Deployment timed out"
          exit 1
